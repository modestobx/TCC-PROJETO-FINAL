#{extends 'main.html' /}
#{set title:'Pré-Matrícula' /}

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0"><i class="fas fa-user-plus"></i> Fazer Pré-Matrícula</h4>
        </div>
        <div class="card-body">
            
            #{if flash.error}
                <div class="alert alert-danger">${flash.error}</div>
            #{/if}

            <form action="@{Application.salvarPreMatricula}" method="POST">
                
                <div class="mb-3">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" name="aluno.nome" value="${aluno?.nome}" class="form-control" required>
                    <span class="text-danger">#{error 'aluno.nome' /}</span>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">CPF</label>
                        <input type="text" name="aluno.cpf" value="${aluno?.cpf}" class="form-control" placeholder="000.000.000-00" required>
                        <span class="text-danger">#{error 'aluno.cpf' /}</span>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Data de Nascimento</label>
                        <input type="date" name="aluno.dataNascimento" value="${aluno?.dataNascimento}" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Endereço</label>
                    <input type="text" name="aluno.endereco" value="${aluno?.endereco}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Crie uma Senha (para acesso ao portal)</label>
                    <input type="password" name="aluno.senha" class="form-control" required>
                    <span class="text-danger">#{error 'aluno.senha' /}</span>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Enviar Pré-Matrícula</button>
                    <a href="@{Application.index}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
