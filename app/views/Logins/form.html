#{extends 'main.html' /}
#{set title:'Login no Sistema Escolar' /}

<div class="card shadow-lg border-0 rounded-4">
    <div class="card-body p-4 p-md-5">
        
        <div class="text-center mb-4">
            
            <i class="fas fa-school fa-3x text-primary mb-3"></i>
            <h4 class="card-title">Sistema de Matrícula</h4>
            <p class="text-muted">Acesse sua conta para continuar</p>
        </div>

        #{if flash.error}
            <div class="alert alert-danger text-center">
                &{flash.error}
            </div>
        #{/if}

        #{form @Logins.logar()}
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-user"></i></span>
                <input type="text" name="matricula" id="matricula" class="form-control form-control-lg" placeholder="Matrícula" required autofocus>
            </div>
            
            <div class="input-group mb-4">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" name="senha" id="senha" class="form-control form-control-lg" placeholder="Senha" required>
            </div>
            
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
            </div>
        #{/form}

    </div>
    <div class="card-footer text-center py-3 border-0">
        <small class="text-muted">&copy; ${new Date().format('yyyy')} - SIGME</small>
    </div>
</div>
